# OLM v1 requires an explicit installer ServiceAccount with sufficient RBAC.
# For production, derive minimal permissions per:
# https://operator-framework.github.io/operator-controller/howto/derive-service-account/
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: topology-aware-lifecycle-manager-installer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: topology-aware-lifecycle-manager-installer
  namespace: openshift-cluster-group-upgrades
